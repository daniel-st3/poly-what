name: Daily Run

on:
  schedule:
    - cron: '0 11 * * *'    # 6am Colombia (UTC-5)
    - cron: '0 19 * * *'    # 2pm Colombia (UTC-5)
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Download previous DB artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: daily_run.yml
          name: watchdog-db
          path: .
          if_no_artifact_found: ignore
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Init DB (idempotent)
        run: watchdog init-db

      - name: Run Polymarket paper trading
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: watchdog run-paper-trading --platform polymarket --iterations 5 --max-markets 300 || echo "⚠️ Polymarket run failed"

      - name: Run Manifold paper trading
        env:
          MANIFOLD_API_KEY: ${{ secrets.MANIFOLD_API_KEY }}
          MANIFOLD_USER_ID: ${{ secrets.MANIFOLD_USER_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: watchdog run-paper-trading --platform manifold --iterations 5 || echo "⚠️ Manifold run failed"

      - name: Run module scans
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          watchdog run-intra-event-arb    || echo "⚠️ ARB scan failed"
          watchdog run-pair-cost-scan     || echo "⚠️ Pair cost scan failed"
          watchdog run-resolution-check   || echo "⚠️ Resolution check failed"
          watchdog run-whale-watch        || echo "⚠️ Whale watch failed"
          watchdog run-ofi-scan           || echo "⚠️ OFI scan failed"
          watchdog run-ensemble-scan      || echo "⚠️ Ensemble scan failed"
          watchdog run-daily-summary      || echo "⚠️ Daily summary failed"

      - name: Analyze paper trades
        run: watchdog analyze-paper-trades || echo "⚠️ Analysis failed"

      - name: Send Telegram summary
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MANIFOLD_API_KEY: ${{ secrets.MANIFOLD_API_KEY }}
          MANIFOLD_USER_ID: ${{ secrets.MANIFOLD_USER_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: watchdog send-daily-telegram || echo "⚠️ Telegram send failed (non-fatal)"

      - name: Upload DB artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watchdog-db
          path: watchdog.db
          retention-days: 7

      - name: Notify failure via Telegram
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 -c "
          import os, httpx
          t = os.getenv('TELEGRAM_BOT_TOKEN'); c = os.getenv('TELEGRAM_CHAT_ID')
          if t and c:
              httpx.post(f'https://api.telegram.org/bot{t}/sendMessage',
                  json={'chat_id': c, 'text': '⚠️ poly-agent GitHub Actions run FAILED — check logs'}, timeout=10)
          "
